[project]
name = "package-github-dwh-blue"
version = "0.1.0"
description = "Blue Package Skill for a GitHub organization warehouse on ClickHouse"
requires-python = ">=3.11"
dependencies = [
  "blue",
  "colors-compute-blue @ git+https://github.com/getcolors/colors-compute.git@5040d93672b9f10e7861f527ea552177369c6851#subdirectory=blue",
  "dlt[clickhouse]>=1.20,<2",
  "dbt-clickhouse>=1.9,<2",
  "requests>=2.32,<3",
]

[tool.uv.sources]
blue = { git = "https://github.com/getcolors/blue.git", rev = "290f313ead5ca162875c33a049c880da017eae09" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/package_github_dwh_blue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
