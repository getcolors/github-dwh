<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>getcolors · GitHub DWH</title><style>:root{font-family:Inter,system-ui;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{padding:50px 6vw;background:#132855;color:white}main{max-width:1100px;margin:35px auto;padding:0 22px}.card{background:white;border:1px solid #dce3ee;border-radius:14px;padding:20px;margin:15px 0}input,button{font:inherit;padding:10px 12px;border:1px solid #ccd5e3;border-radius:8px}button{background:#2855d9;color:white;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6ebf2}.muted{color:#667085}.ok{color:#16845b}.bad{color:#ba3648}</style></head><body><header><h1>getcolors GitHub warehouse</h1><p>One PocketBase run is one systemd-supervised Blue workflow.</p></header><main><div id="login" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Superuser email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><p id="error" class="bad"></p></div><div id="app" hidden><div class="card"><button onclick="runNow()">Run now</button> <span class="muted">Loads all accessible getcolors repositories into ClickHouse, then runs dbt.</span></div><div class="card"><h2>Runs</h2><table><thead><tr><th>Created</th><th>Trigger</th><th>Status</th><th>Exit</th><th>Unit</th><th></th></tr></thead><tbody id="runs"></tbody></table></div></div></main><script>let token=localStorage.pbToken||'';const api=async(path,options={})=>{options.headers={...(options.headers||{}),Authorization:token,'Content-Type':'application/json'};let r=await fetch('/api/'+path,options);if(!r.ok)throw new Error(await r.text());return r.json()};async function login(){try{let r=await api('collections/_superusers/auth-with-password',{method:'POST',body:JSON.stringify({identity:email.value,password:password.value})});token=r.token;localStorage.pbToken=token;show()}catch(e){error.textContent='Authentication failed'}}async function show(){login.hidden=true;app.hidden=false;await refresh();setInterval(refresh,10000)}async function pipeline(){let r=await api('collections/pipelines/records?filter='+encodeURIComponent('name="github-getcolors"'));return r.items[0]}async function runNow(){let p=await pipeline();await api('collections/runs/records',{method:'POST',body:JSON.stringify({pipeline:p.id,event:'run',trigger:'manual',status:'queued',scheduled_for:new Date().toISOString(),idempotency_key:'manual:'+crypto.randomUUID()})});refresh()}async function cancel(id){await api('collections/runs/records/'+id,{method:'PATCH',body:JSON.stringify({cancellation_requested:true})});refresh()}async function refresh(){let r=await api('collections/runs/records?sort=-created&perPage=50');runs.innerHTML=r.items.map(x=>`<tr><td>${x.created}</td><td>${x.trigger}</td><td class="${x.status==='succeeded'?'ok':x.status==='failed'?'bad':''}">${x.status}</td><td>${x.exit??''}</td><td>${x.systemd_unit||''}</td><td>${x.status==='running'?`<button onclick="cancel('${x.id}')">Cancel</button>`:''}</td></tr>`).join('')}if(token)show()</script></body></html>
